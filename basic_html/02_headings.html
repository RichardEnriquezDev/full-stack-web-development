<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings</title>
    <link rel="shortcut icon" href="img/html.ico" type="image/x-icon">
</head>

<body>
    <!--
        An HTML text heading is a tag that defines title and subtitles
        within a web page to organize and establish a hierarchy fot it content. 
    -->
    This is an example of the use of Headings
    <h1>Use only for the main title</h1>
    <h2>Other subtitles</h2>
    <h3>Other subtitles</h3>
    <h4>Other subtitles</h4>
    <h5>Other subtitles</h5>
    <h6>Other subtitles</h6>

    <!--
        Note: In this examples, each header element occupies the full width
        of the page, as they are laid out using bloks.
    -->

</body>
</html>
