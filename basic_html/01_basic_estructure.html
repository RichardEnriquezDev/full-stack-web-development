<!-- To set up a basic HTML structure in VS, type an exclamation mark (!) and then press the Tab key. -->

<!DOCTYPE html> <!-- The document type is specified here so that browsers can interpret it -->
<html lang="en">

<!--
    HTML Elements
    tag: used to construct the entire document
    head: a tag used for the document header. Most of the information is not displayed on the page, but some -such as the title- is.
 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!--
    body: elements that are reflected in the browser
-->
<body>
    
</body>
</html>
