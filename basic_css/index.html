<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Course</title>
    <link rel="stylesheet" href="css/styless.css">
</head>
<body>
    <h1>First lines of the CSS course</h1>
</body>
</html>
<!--
    Web page designs can be created in three ways:

    inline styles or inline CSS:

        <h1 style="color: blue;"> First lines of the CSS course </h1>
    
    internal CSS:
        The following structure is added within the header:

        <style>
        h1 {
            color: blue;
        }
    </style>

    Note: This approach to handling styles in HTML is not recommended.
    
    external CSS:
        A .css file is created hithin our project folder and linked to the HTML as follows:
        in the head:
            <link rel="stylesheet" href="styless.css"> 
        In href" ", we specify the name and path of the file we want to link.
-->
